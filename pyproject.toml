[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxed-code-executor"
version = "0.1.0"
description = "Sandboxed code executor: run agent-written Python inside a hardened subprocess jail (AST validation + runtime audit hook + resource limits)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["sandbox*"]
